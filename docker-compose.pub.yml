services:
  database:
    image: postgres:16.4
    restart: on-failure
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    # ports: НЕТ (база не наружу)
    # ./docker-entrypoint-initdb.d: НЕТ (не сработает на существующем томе)

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - internal

  frontend:
    image: 'ghcr.io/${OWNER}/sp16_frontend:latest'
    restart: on-failure
    volumes:
      - frontend_build:/app/dist
    networks:
      - internal

  backend:
    image: 'ghcr.io/${OWNER}/sp16_backend:latest'
    restart: on-failure
    environment:
      PORT: ${BACKEND_PORT}
      DEBUG: ${BACKEND_DEBUG}
      LOGGER: ${BACKEND_LOGGER}
      DATABASE_DRIVER: postgres
      DATABASE_URL: 'postgres://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}'
      # УБРАНО: DATABASE_USERNAME, DATABASE_PASSWORD
    networks:
      - internal
    depends_on:
      - database
    # ports: НЕТ (только через nginx)

  server:
    image: 'ghcr.io/${OWNER}/sp16_server:latest'
    restart: on-failure
    ports:
      - '80:80'  # Единственный открытый порт
    volumes:
      - frontend_build:/var/www
    depends_on:
      - frontend
      - backend
    networks:
      - internal

volumes:
  db_data:
  pgadmin-data:
  frontend_build:

networks:
  internal:
